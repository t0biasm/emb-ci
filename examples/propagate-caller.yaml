# .github/workflows/propagate.yaml in a generic repository (emb-toolchain,
# emb-platform, emb-ci, ...). After every push to main / release lines (or a
# version tag), move the submodule pointers of all project branches that
# follow it (emb-project.toml) - if their CI is green.
#
# Needs in this repository: variable EMB_BOT_APP_ID, secret EMB_BOT_PRIVATE_KEY.
name: propagate

on:
  push:
    branches: [ main, "release/**" ]
    tags: [ "v*" ]
  schedule:
    - cron: "17 3 * * *"      # nightly reconcile of the default branch
  workflow_dispatch:

jobs:
  propagate:
    if: ${{ vars.EMB_BOT_APP_ID != '' }}     # skipped until the app is configured
    uses: t0biasm/emb-ci/.github/workflows/propagate.yaml@v1.3.0
    with:
      app-id: ${{ vars.EMB_BOT_APP_ID }}
      ci-ref: v1.3.0          # same tag as above
    secrets:
      app-private-key: ${{ secrets.EMB_BOT_PRIVATE_KEY }}
