name: project-ci-canary

# Reusable workflow: build the projects with the commit of a pull request of this
# repository (emb-ci). For every project (repositories of the owner with topic
# emb-project, default branch) the calls of emb-ci's reusable workflows in the
# project's workflows are pointed at the PR commit on a canary branch
# bot/ci-canary-emb-ci-<sha8>; the project CI builds it. Checks appear in the
# PR as "<caller job>/<project>" and the gate job; the canary branch is deleted
# afterwards. Nothing is merged into a project.
#
# Only for pull requests from this repository (secrets are not available to
# forks). Called from .github/workflows/project-canary.yaml.

on:
  workflow_call:
    inputs:
      app-id:
        description: "ID of the GitHub App that pushes the canary branches"
        type: string
        required: true
      sha:
        description: "Commit of this repository to test (the PR head)"
        type: string
        required: true
      pr-number:
        description: "Pull request number (for the branch and the title)"
        type: string
        required: true
    secrets:
      app-private-key:
        required: true

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.find.outputs.targets }}
    steps:
      - name: Create app token
        id: app
        uses: actions/create-github-app-token@v2.0.6
        with:
          app-id: ${{ inputs.app-id }}
          private-key: ${{ secrets.app-private-key }}
          owner: ${{ github.repository_owner }}

      - name: Find projects
        id: find
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          targets=$(gh api -X GET search/repositories \
            -f q="topic:emb-project user:$OWNER archived:false" \
            --jq '[.items[] | {project: .full_name, branch: .default_branch, label: (.name + "@" + .default_branch)}]' \
            | jq -c .)
          echo "Targets: $targets"
          echo "targets=$targets" >> "$GITHUB_OUTPUT"

  build:
    needs: discover
    if: ${{ needs.discover.outputs.targets != '[]' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.discover.outputs.targets) }}
    name: ${{ matrix.target.label }}
    concurrency:
      group: emb-project-canary-${{ inputs.pr-number }}-${{ matrix.target.project }}
      cancel-in-progress: true
    steps:
      - name: Create app token
        id: app
        uses: actions/create-github-app-token@v2.0.6
        with:
          app-id: ${{ inputs.app-id }}
          private-key: ${{ secrets.app-private-key }}
          owner: ${{ github.repository_owner }}

      - name: Checkout emb-ci at the PR commit (bot scripts)
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}
          path: .emb-ci

      - name: Checkout project branch
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.target.project }}
          ref: ${{ matrix.target.branch }}
          token: ${{ steps.app.outputs.token }}
          path: project

      - name: Point the project's emb-ci calls at the PR commit and push a canary branch
        id: bump
        working-directory: project
        env:
          NEW_SHA: ${{ inputs.sha }}
          SRC_REPO: ${{ github.repository }}
          BRANCH: ${{ matrix.target.branch }}
          TITLE: "Canary: ${{ github.repository }} PR #${{ inputs.pr-number }} (${{ inputs.sha }})"
          BOT_NAME: ${{ steps.app.outputs.app-slug }}[bot]
          BOT_EMAIL: ${{ steps.app.outputs.app-slug }}[bot]@users.noreply.github.com
        run: ../.emb-ci/bot/ci-canary.sh

      - name: Wait for the project CI
        id: wait
        if: ${{ steps.bump.outputs.changed == 'true' }}
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          PROJECT: ${{ matrix.target.project }}
          COMMIT: ${{ steps.bump.outputs.commit }}
        run: echo "result=$(.emb-ci/bot/wait-ci.sh)" >> "$GITHUB_OUTPUT"

      - name: Summary
        if: ${{ always() }}
        env:
          PROJECT: ${{ matrix.target.project }}
          BRANCH: ${{ matrix.target.branch }}
          CHANGED: ${{ steps.bump.outputs.changed }}
          COMMIT: ${{ steps.bump.outputs.commit }}
          RESULT: ${{ steps.wait.outputs.result }}
        run: |
          {
            echo "### project CI ${PROJECT}@${BRANCH}"
            if [ "$CHANGED" != "true" ]; then
              echo "Nothing to build: the workflows already use this commit."
            else
              echo "Result: **${RESULT:-not run}**"
              echo ""
              echo "Project build: https://github.com/${PROJECT}/commit/${COMMIT}/checks"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Delete the canary branch
        if: ${{ always() && steps.bump.outputs.changed == 'true' }}
        working-directory: project
        env:
          BOT_BRANCH: ${{ steps.bump.outputs.bot_branch }}
        run: git push --quiet origin --delete "$BOT_BRANCH" || echo "::warning::could not delete $BOT_BRANCH"

      - name: Fail unless green
        if: ${{ steps.bump.outputs.changed == 'true' && steps.wait.outputs.result != 'green' }}
        env:
          RESULT: ${{ steps.wait.outputs.result }}
          PROJECT: ${{ matrix.target.project }}
          COMMIT: ${{ steps.bump.outputs.commit }}
        run: |
          echo "::error::${PROJECT} CI for this PR is ${RESULT}: https://github.com/${PROJECT}/commit/${COMMIT}/checks"
          exit 1

  gate:
    needs: [discover, build]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    name: gate
    steps:
      - name: All project builds green (or none)
        env:
          DISCOVER: ${{ needs.discover.result }}
          BUILD: ${{ needs.build.result }}
        run: |
          if [ "$DISCOVER" != "success" ]; then
            echo "::error::project canary did not run (discover: $DISCOVER)"
            exit 1
          fi
          case "$BUILD" in
            success|skipped) echo "All project builds passed (or there are none)." ;;
            *) echo "::error::project build result: $BUILD"; exit 1 ;;
          esac
