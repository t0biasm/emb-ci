name: propagate-self

# emb-ci is a generic repository now: after a push to main, projects that follow
# ci/emb-ci get the new commit (bump, CI, fast-forward). See propagate.yaml.
#
# Needs in this repository: variable EMB_BOT_APP_ID, secret EMB_BOT_PRIVATE_KEY.

on:
  push:
    branches: [ main ]
  schedule:
    - cron: "19 3 * * *"       # nightly reconcile of the default branch
  workflow_dispatch:

permissions:
  contents: read

jobs:
  propagate:
    if: ${{ vars.EMB_BOT_APP_ID != '' }}
    uses: ./.github/workflows/propagate.yaml
    with:
      app-id: ${{ vars.EMB_BOT_APP_ID }}
      ci-ref: ${{ github.sha }}
    secrets:
      app-private-key: ${{ secrets.EMB_BOT_PRIVATE_KEY }}
