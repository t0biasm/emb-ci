name: canary

# Reusable workflow: build the project branches that follow the base branch of
# a pull request of a generic repository (emb-toolchain, emb-platform, ...),
# with the submodules pointing at the PR's head commit.
#
# Per target (project branch) a canary branch bot/canary-<repo>-<sha8> is pushed
# to the project; the project CI builds it (push trigger on bot/**) on the
# self-hosted runner. The result is shown as check "canary / ci / <repo>@<branch>"
# in the PR; the gate job ("canary / ci / gate" in a caller with job id ci) fails
# if any target is red. Nothing is merged into a project branch, the canary
# branch is deleted afterwards.
#
# All pull request data (base, head, description) is read from the API, so the
# same code runs for a pull_request event and for a re-run (workflow_dispatch
# with pr-number).
#
# "Depends-on: https://github.com/<owner>/<repo>/pull/<n>" lines in the PR
# description add that PR's head to the pins: the project is built with both
# (bot/canary-targets.sh). Dependencies must be authored by a collaborator.
#
# After a pull_request run, the canary of every open PR of this repository that
# lists this PR in Depends-on is started again (bot/dependents.sh). Re-runs do
# not start further re-runs, so there is no loop; a dependency of a dependency
# is not re-run.
#
# Only pull requests from this repository are built (secrets are not available
# to forks). Call from a generic repo, pinned by tag (examples/canary-caller.yaml).
# The GitHub App needs the same permissions as for propagate.

on:
  workflow_call:
    inputs:
      app-id:
        description: "ID of the GitHub App that pushes the canary branches"
        type: string
        required: true
      ci-ref:
        description: "Tag/ref of emb-ci that provides bot/ and tools/"
        type: string
        required: true
      pr-number:
        description: "Pull request to canary (from the caller's pull_request or workflow_dispatch event)"
        type: string
        required: true
    secrets:
      app-private-key:
        required: true

permissions:
  contents: read

jobs:
  pr:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      base: ${{ steps.info.outputs.base }}
      head: ${{ steps.info.outputs.head }}
      branch: ${{ steps.info.outputs.branch }}
      same-repo: ${{ steps.info.outputs.same-repo }}
    steps:
      - name: Read the pull request
        id: info
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr-number }}
        run: |
          set -euo pipefail
          info=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" \
            --jq '[.base.ref, .head.sha, .head.ref, (.head.repo.full_name == .base.repo.full_name)] | @tsv')
          read -r base head branch same <<<"$info"
          {
            echo "base=$base"
            echo "head=$head"
            echo "branch=$branch"
            echo "same-repo=$same"
          } >> "$GITHUB_OUTPUT"

  discover:
    needs: pr
    if: ${{ needs.pr.outputs.same-repo == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.find.outputs.targets }}
    steps:
      - name: Create app token
        id: app
        uses: actions/create-github-app-token@v2.0.6
        with:
          app-id: ${{ inputs.app-id }}
          private-key: ${{ secrets.app-private-key }}
          owner: ${{ github.repository_owner }}

      - name: Checkout emb-ci (bot scripts)
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/emb-ci
          ref: ${{ inputs.ci-ref }}
          path: .emb-ci

      - name: Find project branches that follow this PR (and its Depends-on repositories)
        id: find
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          OWNER: ${{ github.repository_owner }}
          SRC_REF: refs/heads/${{ needs.pr.outputs.base }}
          SRC_NAME: ${{ github.event.repository.name }}
          PR_NUMBER: ${{ inputs.pr-number }}
          PR_HEAD_SHA: ${{ needs.pr.outputs.head }}
        run: |
          set -euo pipefail
          PR_BODY=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.body // ""')
          export PR_BODY
          targets=$(.emb-ci/bot/canary-targets.sh)
          echo "Targets: $targets"
          echo "targets=$targets" >> "$GITHUB_OUTPUT"

  rerun-dependents:
    needs: pr
    if: ${{ github.event_name == 'pull_request' && needs.pr.outputs.same-repo == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      actions: write
    steps:
      - name: Checkout emb-ci (bot scripts)
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/emb-ci
          ref: ${{ inputs.ci-ref }}
          path: .emb-ci

      - name: Start the canary of the PRs that depend on this one
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ inputs.pr-number }}
        run: |
          set -euo pipefail
          dependents=$(.emb-ci/bot/dependents.sh)
          if [ -z "$dependents" ]; then
            echo "No open pull request depends on #$NUMBER."
            exit 0
          fi
          while read -r number branch; do
            echo "Re-running the canary of #$number ($branch)"
            if ! gh workflow run canary.yaml -R "$REPO" --ref "$branch" -f pr-number="$number"; then
              echo "::warning::could not start the canary of #$number (its branch needs the workflow_dispatch trigger of the caller)"
            fi
          done <<<"$dependents"

  build:
    needs: [pr, discover]
    if: ${{ needs.discover.result == 'success' && needs.discover.outputs.targets != '[]' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.discover.outputs.targets) }}
    name: ${{ matrix.target.label }}
    concurrency:
      group: emb-canary-${{ inputs.pr-number }}-${{ matrix.target.project }}-${{ matrix.target.branch }}
      cancel-in-progress: true
    steps:
      - name: Create app token
        id: app
        uses: actions/create-github-app-token@v2.0.6
        with:
          app-id: ${{ inputs.app-id }}
          private-key: ${{ secrets.app-private-key }}
          owner: ${{ github.repository_owner }}

      - name: Checkout emb-ci (bot scripts)
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/emb-ci
          ref: ${{ inputs.ci-ref }}
          path: .emb-ci

      - name: Checkout project branch
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.target.project }}
          ref: ${{ matrix.target.branch }}
          token: ${{ steps.app.outputs.token }}
          path: project

      - name: Point submodules at the PR heads and push a canary branch
        id: bump
        working-directory: project
        env:
          NEW_SHA: ${{ needs.pr.outputs.head }}
          PINS: ${{ toJSON(matrix.target.pins) }}
          SRC_REPO: ${{ github.repository }}
          BRANCH: ${{ matrix.target.branch }}
          KIND: canary
          ALLOW_NON_FF: "true"
          TITLE: "Canary: ${{ github.repository }} PR #${{ inputs.pr-number }} (${{ needs.pr.outputs.head }})"
          BOT_NAME: ${{ steps.app.outputs.app-slug }}[bot]
          BOT_EMAIL: ${{ steps.app.outputs.app-slug }}[bot]@users.noreply.github.com
        run: ../.emb-ci/bot/bump.sh

      - name: Wait for the project CI
        id: wait
        if: ${{ steps.bump.outputs.changed == 'true' }}
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          PROJECT: ${{ matrix.target.project }}
          COMMIT: ${{ steps.bump.outputs.commit }}
        run: echo "result=$(.emb-ci/bot/wait-ci.sh)" >> "$GITHUB_OUTPUT"

      - name: Summary
        if: ${{ always() }}
        env:
          PROJECT: ${{ matrix.target.project }}
          BRANCH: ${{ matrix.target.branch }}
          CHANGED: ${{ steps.bump.outputs.changed }}
          COMMIT: ${{ steps.bump.outputs.commit }}
          RESULT: ${{ steps.wait.outputs.result }}
        run: |
          {
            echo "### canary ${PROJECT}@${BRANCH}"
            if [ "$CHANGED" != "true" ]; then
              echo "Nothing to build: ${PROJECT} already points at this commit."
            else
              echo "Result: **${RESULT:-not run}**"
              echo ""
              echo "Project build: https://github.com/${PROJECT}/commit/${COMMIT}/checks"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Delete the canary branch
        if: ${{ always() && steps.bump.outputs.changed == 'true' }}
        working-directory: project
        env:
          BOT_BRANCH: ${{ steps.bump.outputs.bot_branch }}
        run: git push --quiet origin --delete "$BOT_BRANCH" || echo "::warning::could not delete $BOT_BRANCH"

      - name: Fail unless green
        if: ${{ steps.bump.outputs.changed == 'true' && steps.wait.outputs.result != 'green' }}
        env:
          RESULT: ${{ steps.wait.outputs.result }}
          PROJECT: ${{ matrix.target.project }}
          COMMIT: ${{ steps.bump.outputs.commit }}
        run: |
          echo "::error::${PROJECT} CI for this PR is ${RESULT}: https://github.com/${PROJECT}/commit/${COMMIT}/checks"
          exit 1

  gate:
    needs: [discover, build]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    name: gate
    steps:
      - name: All targets green (or none)
        env:
          DISCOVER: ${{ needs.discover.result }}
          BUILD: ${{ needs.build.result }}
        run: |
          # discover is skipped for pull requests from forks (no secrets there)
          if [ "$DISCOVER" != "success" ]; then
            echo "::error::canary did not run (discover: $DISCOVER). Only pull requests from this repository are built."
            exit 1
          fi
          case "$BUILD" in
            success|skipped) echo "All canary targets passed (or there are none)." ;;
            *) echo "::error::canary build result: $BUILD"; exit 1 ;;
          esac
